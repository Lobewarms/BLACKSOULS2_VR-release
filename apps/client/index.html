<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLACK SOULS II VR</title>
<style>
  html, body { margin: 0; height: 100%; background: #030305; color: #d8d0c0; font: 14px "Malgun Gothic", sans-serif; overflow: hidden; }
  #app { position: fixed; inset: 0; }
  #hud { position: fixed; left: 12px; top: 10px; right: 12px; display: flex; gap: 14px; align-items: flex-start; pointer-events: none; z-index: 2; }
  #status { background: rgba(0,0,0,.55); padding: 6px 10px; border-radius: 6px; }
  #vrbtn { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 3; }
  #vrbtn button { width: 100px; padding: 12px 6px; border: 1px solid #fff; border-radius: 4px; background: rgba(0,0,0,.1);
    color: #fff; font: 13px sans-serif; text-align: center; opacity: .5; outline: none; cursor: pointer; }
  #vrbtn button:hover:enabled { opacity: 1; }
  #vrbtn button:disabled { cursor: auto; }
  #vrbtn button.wide { width: 150px; }
  /* while the headset is on, the page shows the player's view for people watching */
  #spectator { position: fixed; inset: 0; width: 100%; height: 100%; display: none; z-index: 1; background: #000; }
  body.spectating #spectator { display: block; }
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <div id="status">로딩 중...</div>
</div>
<div id="vrbtn"></div>
<script type="module" src="/src/core/main.js"></script>
</body>
</html>
