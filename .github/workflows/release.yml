name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish tested Windows setup and portable ZIP
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mod-package-ubuntu-latest
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mod-package-windows-latest
          path: windows-artifacts
      - name: Promote tested Windows installer
        run: |
          cp windows-artifacts/*.exe windows-artifacts/*.exe.sha256 dist/
          cd dist
          sha256sum --check *.exe.sha256
      - name: Validate tag and tested release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python tooling/release/package_release.py \
            --verify "dist/BLACKSOULS_VR_${RELEASE_TAG#v}.zip" --version "${RELEASE_TAG#v}"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace published assets."
            exit 1
          fi
          release_flags=(--latest)
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_flags=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" dist/*.exe dist/*.zip dist/*.sha256 dist/*.whl "${release_flags[@]}" \
            --verify-tag --title "BLACK SOULS II VR $RELEASE_TAG" \
            --notes-file RELEASE_NOTES.txt
